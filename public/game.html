                <label>Game Name: </label> <input type="text" id="GName"><br>

                            <label>Playstation</label>
                        </div>

                    </div>
                    <div class="console">
                        <div class = "picTitle">

                <form action="/upload" method="post" enctype="multipart/form-data">
